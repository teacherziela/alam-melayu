<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HistoryVerse 360 — Alam Melayu</title><style>*{box-sizing:border-box}body{margin:0;background:#101e1b;color:#fff;font-family:system-ui}canvas{display:block}#hud{position:fixed;top:12px;left:12px;background:#10251fc9;padding:13px;border:1px solid #b99c56;border-radius:12px;max-width:330px}#hud small{color:#e6ca80}#quest{margin-top:8px;font-size:13px}#dialog{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);background:#10251fee;border:1px solid #dbb767;padding:16px;border-radius:12px;width:min(92vw,500px);display:none}button{background:#e6c275;color:#17291e;border:0;border-radius:9px;padding:10px;font-weight:bold;cursor:pointer;margin:4px}#controls{position:fixed;bottom:15px;left:15px;display:grid;grid-template-columns:repeat(3,48px);gap:4px}#controls button{height:48px;margin:0;touch-action:none}#act{position:fixed;bottom:22px;right:20px}#tip{position:fixed;top:12px;right:12px;background:#10251fc9;padding:10px;border-radius:9px;font-size:12px;max-width:180px}#answer button{display:block;width:100%;text-align:left}</style></head><body><div id="hud"><b>⚔️ HISTORYVERSE 360</b><br><small>Bab 1 · Kerajaan Alam Melayu</small><div id="quest"></div></div><div id="tip">WASD / anak panah: bergerak<br>E: bercakap · Telefon: butang arah<br>Seret skrin: putar kamera</div><div id="dialog"><div id="speech"></div><div id="answer"></div><button id="close">Tutup</button></div><div id="controls"><span></span><button data-key="ArrowUp">▲</button><span></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button id="act">💬 Bercakap</button><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ecbd4);scene.fog=new THREE.Fog(0x8ecbd4,35,105);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd6efff,0x66804d,2));const sun=new THREE.DirectionalLight(0xffe4aa,2);sun.position.set(-15,30,10);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.88});const grass=mat(0x638f4b),wood=mat(0x754529),roof=mat(0x94502c),gold=mat(0xe6bd60);function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}function cone(r,h,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.ConeGeometry(r,h,6),m);o.position.set(x,y,z);parent.add(o);return o}box(170,.5,170,grass,0,-.3,0);const road=mat(0xc2a577);box(9,.04,130,road,0,.01,0);box(130,.04,7,road,0,.015,-16);
function tree(x,z){box(.65,4,.65,wood,x,2,z);cone(2.6,5,mat(0x287b45),x,5,z);cone(2,4,mat(0x359554),x,7,z)}for(let i=0;i<65;i++){let x=(Math.random()-.5)*125,z=(Math.random()-.5)*125;if(Math.abs(x)<9||Math.abs(z+16)<8)continue;tree(x,z)}
function house(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);box(5,3.5,5,mat(0xcda16b),0,2.2,0,g);cone(4.3,3,roof,0,5.3,0,g);box(1.3,2.3,.12,wood,0,1.7,2.55,g);for(let a of [-1,1])box(.7,.7,.13,mat(0x45372a),a*1.6,2.7,2.56,g)}house(-14,-6);house(14,-7);house(-16,-32);house(17,-30);house(-16,13);house(17,15);house(0,-53,2.1);
function character(color,x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(1.1,1.8,.75,mat(color),0,1.65,0,g);const head=new THREE.Mesh(new THREE.SphereGeometry(.48,12,10),mat(0xc58c61));head.position.y=2.85;g.add(head);cone(.7,.6,mat(0x49352a),0,3.4,0,g);for(let a of [-1,1]){box(.35,1.2,.4,mat(color),a*.8,1.65,0,g);box(.38,.85,.45,mat(0x332d29),a*.32,.45,0,g)}return g}const player=character(0x225c67,0,9);const npcData=[{x:-6,z:1,name:'Pendeta Alam Melayu',topic:'1.1 Konsep Alam Melayu',q:'Apakah yang merangkumi konsep Alam Melayu?',choices:['Geografi, bahasa dan budaya','Satu pulau sahaja','Eropah dan Afrika'],correct:0,ex:'Konsep Alam Melayu dilihat melalui aspek geografi, bahasa dan budaya.'},{x:6,z:-13,name:'Pengembara Kerajaan',topic:'1.2 Kewujudan Kerajaan Alam Melayu',q:'Antara berikut, yang manakah kerajaan Alam Melayu yang masyhur?',choices:['Rom','Srivijaya','Parsi'],correct:1,ex:'Srivijaya ialah antara kerajaan Alam Melayu yang masyhur.'},{x:-6,z:-27,name:'Utusan Diplomatik',topic:'1.3 Kerajaan Alam Melayu yang Masyhur',q:'Kerajaan manakah terkenal sebagai pusat perdagangan dan kuasa maritim?',choices:['Srivijaya','Yunani','Mesir'],correct:0,ex:'Srivijaya berkembang sebagai kuasa maritim dan pusat perdagangan.'},{x:6,z:-44,name:'Duta Kerajaan Luar',topic:'1.4 Kerajaan Alam Melayu dan Kerajaan Luar yang Sezaman',q:'Apakah bentuk hubungan kerajaan Alam Melayu dengan kerajaan luar?',choices:['Diplomatik dan perdagangan','Tiada hubungan langsung','Hanya peperangan'],correct:0,ex:'Hubungan diplomatik dan perdagangan wujud dengan kerajaan luar yang sezaman.'}];npcData.forEach(n=>n.mesh=character(0x914b34,n.x,n.z));const keys=new Set(),done=new Set();let active=null, yaw=0,drag=false,lastX=0;const quest=document.getElementById('quest'),dialog=document.getElementById('dialog'),speech=document.getElementById('speech'),answer=document.getElementById('answer');function hud(){quest.innerHTML=`Misi selesai: ${done.size}/4 · XP: ${done.size*100}<br>${npcData.map((n,i)=>(done.has(i)?'✅':'◻️')+' '+n.topic).join('<br>')}<br><small>Rekod kemajuan disimpan pada peranti ini.</small>`}try{JSON.parse(localStorage.getItem('historyverse-progress')||'[]').forEach(i=>done.add(i))}catch{}hud();function talk(){let nearest=null,dist=5;for(let i=0;i<npcData.length;i++){const n=npcData[i],d=Math.hypot(n.x-player.position.x,n.z-player.position.z);if(d<dist){nearest=i;dist=d}}if(nearest===null){speech.textContent='Dekati watak NPC untuk menerima misi.';answer.innerHTML='';dialog.style.display='block';return}active=nearest;const n=npcData[nearest];speech.innerHTML=`<b>${n.name}</b><br>${n.topic}<p>${done.has(nearest)?'Misi telah diselesaikan!':n.q}</p>`;answer.innerHTML='';if(!done.has(nearest))n.choices.forEach((c,j)=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{if(j===n.correct){done.add(nearest);localStorage.setItem('historyverse-progress',JSON.stringify([...done]));speech.innerHTML=`✅ Betul! +100 XP<br>${n.ex}`;answer.innerHTML='';hud()}else{speech.innerHTML=`❌ Cuba lagi.<p>${n.q}</p>`}};answer.append(b)});dialog.style.display='block'}document.getElementById('act').onclick=talk;document.getElementById('close').onclick=()=>dialog.style.display='none';window.addEventListener('keydown',e=>{keys.add(e.key);if(e.key.toLowerCase()==='e')talk()});window.addEventListener('keyup',e=>keys.delete(e.key));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-lastX)*.006;lastX=e.clientX}});const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);let dx=0,dz=0;if(keys.has('w')||keys.has('ArrowUp'))dz-=1;if(keys.has('s')||keys.has('ArrowDown'))dz+=1;if(keys.has('a')||keys.has('ArrowLeft'))dx-=1;if(keys.has('d')||keys.has('ArrowRight'))dx+=1;if(dx||dz){const v=new THREE.Vector3(dx,0,dz).normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.addScaledVector(v,dt*7);player.position.x=THREE.MathUtils.clamp(player.position.x,-65,65);player.position.z=THREE.MathUtils.clamp(player.position.z,-65,65);player.rotation.y=Math.atan2(-v.x,-v.z)}const target=player.position.clone().add(new THREE.Vector3(Math.sin(yaw)*10,8,Math.cos(yaw)*10));camera.position.lerp(target,.085);camera.lookAt(player.position.x,2,player.position.z);renderer.render(scene,camera)}loop();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
